<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pedidos y Pagos</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="login-wrapper">
        <!-- PANEL IZQUIERDO: BRANDING -->
        <div class="login-branding">
            <div class="branding-logo">📦</div>
            <h1 class="branding-title">Pedidos & Pagos</h1>
            <p class="branding-text">Sistema académico de gestión de pedidos.</p>
            <div class="branding-features">
                <div class="feature-item">🔒 Conexión segura</div>
                <div class="feature-item">⚡ Gestión en tiempo real</div>
                <div class="feature-item">📊 Reportes integrados</div>
            </div>
        </div>

        <!-- PANEL DERECHO: FORMULARIO -->
        <div class="login-form-container">
            <div class="form-header">
                <h2>Bienvenido 👋</h2>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <form id="loginForm">
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="admin@pedidos.com" required autocomplete="email">
                        <span class="input-icon">📧</span>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required minlength="6"
                            autocomplete="current-password">
                        <span class="input-icon">🔑</span>
                        <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                    </div>
                </div>

                <!-- Opciones -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span class="checkmark"></span>
                        Recordarme
                    </label>
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón Login -->
                <button type="submit" class="btn-login">Iniciar Sesión</button>

                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-text">o continúa con</span>
                    <span class="divider-line"></span>
                </div>

                <!-- Botones Sociales (Decorativos) -->
                <div class="social-buttons">
                    <button type="button" class="btn-social"><span>🔵</span> Google</button>
                    <button type="button" class="btn-social"><span>⚫</span> GitHub</button>
                </div>
            </form>

            <div class="register-link">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <!-- NOTIFICACIÓN TOAST (Alerta Bonita) -->
    <div id="toast" class="toast">
        <div class="toast-icon">✅</div>
        <div class="toast-content">
            <span class="toast-title">¡Éxito!</span>
            <span class="toast-message">Mensaje aquí...</span>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
