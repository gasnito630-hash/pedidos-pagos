# ==================== SERVER (Render FREE Tier) ====================
# ✅ Forzar escucha en TODAS las interfaces
server.address=0.0.0.0
# ✅ Usar EXACTAMENTE el puerto que Render asigna (sin fallback)
server.port=${PORT}
# ✅ Forward headers para proxies (Render usa proxy)
server.forward-headers-strategy=framework
# ✅ Shutdown graceful
server.shutdown=graceful

# ==================== BASE DE DATOS ====================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP optimizado para Render FREE (con timeouts más largos)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000

# ==================== JPA / HIBERNATE ====================
spring.jpa.packages-to-scan=com.ecommerce.pedidos_pagos.infrastructure.adapter.out.persistence.entity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# ==================== SPRING BOOT OPTIMIZADO PARA FREE TIER ====================
# ✅ Inicialización perezosa para reducir memoria y acelerar startup
spring.main.lazy-initialization=true
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ✅ Reducir logging para menos overhead
logging.level.root=WARN
logging.level.com.ecommerce=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# ==================== JWT ====================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==================== CORS ====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.onrender.com,http://localhost:8080}

# ==================== UPLOADS ====================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=/tmp/uploads
