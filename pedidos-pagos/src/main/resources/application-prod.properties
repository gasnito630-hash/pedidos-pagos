# ==================== SERVER (CRÍTICO PARA RENDER) ====================
# ✅ Escuchar en todas las interfaces
server.address=0.0.0.0
# ✅ Usar EXACTAMENTE el puerto que Render asigna (sin fallback)
server.port=${PORT}
# ✅ Timeout para shutdown graceful
server.shutdown=graceful

# ==================== BASE DE DATOS ====================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP optimizado para Render (con timeouts más generosos)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# ==================== JPA / HIBERNATE ====================
spring.jpa.packages-to-scan=com.ecommerce.pedidos_pagos.infrastructure.adapter.out.persistence.entity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== JWT ====================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==================== CORS ====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.onrender.com,http://localhost:8080}

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.ecommerce=INFO
logging.level.org.springframework.web=INFO
# ✅ Habilitar logs de startup para debug
logging.level.org.springframework.boot=DEBUG
