# ==================== BASE DE DATOS ====================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / HIBERNATE ====================
spring.jpa.packages-to-scan=com.ecommerce.pedidos_pagos.infrastructure.adapter.out.persistence.entity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== SERVER (CRÍTICO PARA RENDER) ====================
server.address=0.0.0.0
server.port=${PORT}
server.shutdown=graceful

# ==================== JWT (CRÍTICO) ====================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==================== CORS ====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.onrender.com,http://localhost:8080}

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.ecommerce=INFO
