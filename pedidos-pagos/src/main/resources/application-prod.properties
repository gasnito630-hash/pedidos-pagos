# Configuración para Render (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.packages-to-scan=com.ecommerce.pedidos_pagos.infrastructure.adapter.out.persistence.entity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.ecommerce=DEBUG

# =========================================================================
# Configuración del Token JWT (Variables requeridas por tu JwtUtil)
# =========================================================================
# NOTA: La clave debe tener mínimo 32 caracteres (256 bits) para algoritmos HS256
security.jwt.secret=MiClaveSecretaUltraSeguraParaFirmarLosTokensJWT2026!
security.jwt.expiration=86400000

# Duplicamos bajo el estándar alternativo por si tu clase usa estas llaves:
jwt.secret=MiClaveSecretaUltraSeguraParaFirmarLosTokensJWT2026!
jwt.expiration=86400000

# =========================================================================
# Logging para Diagnósticos (Debug)
# =========================================================================
logging.level.com.ecommerce.pedidos_pagos=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# =========================================================================
# Gestión de Recursos Estáticos (Asegura la carga de archivos web)
# =========================================================================
spring.web.resources.static-locations=classpath:/static/

# Configuración JWT exacta requerida por tu clase JwtUtil
app.jwt.secret=MiClaveSecretaUltraSeguraParaFirmarLosTokensJWT2026!
app.jwt.expiration=86400000

