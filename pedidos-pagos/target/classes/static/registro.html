<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Pedidos y Pagos</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        .branding-features {
            display: none;
        }

        /* Ocultar features en registro */
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-branding">
            <div class="branding-logo">📦</div>
            <h1 class="branding-title">Únete a Nosotros</h1>
            <p class="branding-text">Crea tu cuenta y comienza a gestionar tus pedidos.</p>
        </div>

        <div class="login-form-container">
            <div class="form-header">
                <h2>Crear Cuenta 📝</h2>
                <p>Completa tus datos para registrarte</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="regEmail">Correo electrónico</label>
                    <div class="input-wrapper">
                        <input type="email" id="regEmail" placeholder="tu@email.com" required>
                        <span class="input-icon">📧</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required
                            minlength="6">
                        <span class="input-icon">🔑</span>
                    </div>
                </div>

                <button type="submit" class="btn-login">Registrarme</button>
            </form>

            <div class="register-link">
                ¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <div class="toast-icon">✅</div>
        <div class="toast-content">
            <span class="toast-title">¡Éxito!</span>
            <span class="toast-message"></span>
        </div>
    </div>

    <script src="registro.js"></script>
</body>

</html>
