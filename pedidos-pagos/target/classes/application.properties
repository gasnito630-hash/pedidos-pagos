spring.application.name=pedidos-pagos
server.port=${PORT:8080}
# =========================================================================
# SQL Server - Configuración de Conexión
# =========================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=pedidos_pagos;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=TuPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================================================================
# JPA / Hibernate - Ajustes de Persistencia
# =========================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# Naming strategies (Mapea los nombres tal cual están en la base de datos)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# =========================================================================
# Configuración del Token JWT (Variables requeridas por tu JwtUtil)
# =========================================================================
# NOTA: La clave debe tener mínimo 32 caracteres (256 bits) para algoritmos HS256
security.jwt.secret=MiClaveSecretaUltraSeguraParaFirmarLosTokensJWT2026!
security.jwt.expiration=86400000

# Duplicamos bajo el estándar alternativo por si tu clase usa estas llaves:
jwt.secret=MiClaveSecretaUltraSeguraParaFirmarLosTokensJWT2026!
jwt.expiration=86400000

# =========================================================================
# Logging para Diagnósticos (Debug)
# =========================================================================
logging.level.com.ecommerce.pedidos_pagos=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# =========================================================================
# Gestión de Recursos Estáticos (Asegura la carga de archivos web)
# =========================================================================
spring.web.resources.static-locations=classpath:/static/

# Configuración JWT exacta requerida por tu clase JwtUtil
app.jwt.secret=MiClaveSecretaUltraSeguraParaFirmarLosTokensJWT2026!
app.jwt.expiration=86400000
